<!doctype html>
<html>
<meta charset="utf-8">
<title>Capture to HTML</title>
<style>
  /* Pretendard 라틴 서브셋(29KB). 한글은 시스템 폰트에 맡긴다 —
     전체를 넣으면 2MB 라 확장 크기가 감당이 안 된다. */
  @font-face {
    font-family: Pretendard;
    src: url('fonts/pretendard-latin.woff2') format('woff2');
    font-weight: 100 900;
    font-display: block;
  }
  :root {
    color-scheme: light dark;
    --sans: Pretendard, -apple-system, "Apple SD Gothic Neo", system-ui, "Malgun Gothic", sans-serif;
    --bg: #fff; --fg: #16181d; --dim: #5f6673; --line: #e3e5e9;
    /* --accent 는 테두리·배지용, --accent-btn 은 흰 글씨를 얹는 버튼용.
       같은 값을 쓰면 버튼 대비(4.5:1)나 테두리 선명함 중 하나가 깨진다. */
    --accent: #ea580c; --accent-btn: #c2410c; --accent-soft: #fff4ec; --off: #8a909b;
    --knob: #fff;
    --ok-bg: #edf7ee; --ok-fg: #1c7a2e;
    --warn-bg: #fdf1ee; --warn-fg: #a33b1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1f24; --fg: #e8eaed; --dim: #9aa0aa; --line: #33373e;
      --accent: #fb923c; --accent-btn: #c2410c; --accent-soft: #33220f; --off: #5a6069;
      --knob: #b9bfc8;
      --ok-bg: #1d2b21; --ok-fg: #6ed17f;
      --warn-bg: #33221d; --warn-fg: #f0a184;
    }
  }
  * { box-sizing: border-box; }
  html { width: 316px; }
  body {
    width: 100%; max-height: 598px; margin: 0; padding: 0;
    /* 넘치는 건 .opts 안에서만 스크롤한다. 여기가 visible 이면
       내용이 팝업 밖으로 흘러 아무 데서도 스크롤이 안 된다. */
    overflow: hidden;
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  header { padding: 13px 15px 11px; border-bottom: 1px solid var(--line); flex: none; }
  .brand { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13px; letter-spacing: -.01em; }
  .brand img { flex: none; border-radius: 4px; }
  .page { margin-top: 7px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { margin-top: 2px; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }

  .top { flex: none; padding: 13px 15px 0; }
  .heading { font-size: 11px; font-weight: 600; color: var(--dim); margin-bottom: 8px; }

  .choice { display: block; position: relative; padding: 9px 30px 9px 11px; margin-bottom: 6px;
            border: 1.5px solid var(--line); border-radius: 9px; cursor: pointer; }
  .choice:last-of-type { margin-bottom: 0; }
  .choice.on { border-color: var(--accent); background: var(--accent-soft); }
  /* 선택 상태를 색 하나에만 기대지 않는다 */
  .choice.on::after { content: '✓'; position: absolute; right: 11px; top: 8px;
                      font-weight: 700; color: var(--accent); }
  .choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .choice:has(input:focus-visible) { outline: 2px solid var(--fg); outline-offset: 2px; }
  .choice b { display: block; font-size: 12.5px; font-weight: 600; }
  .choice span { display: block; font-size: 11px; color: var(--dim); margin-top: 1px; line-height: 1.4; }

  .go { display: block; width: 100%; margin-top: 13px; padding: 11px; font: inherit;
        font-weight: 700; font-size: 13px; border: 0; border-radius: 9px;
        background: var(--accent-btn); color: #fff; cursor: pointer; }
  .go:disabled { opacity: .5; cursor: default; }
  .opt.shortcut { cursor: default; align-items: center; }
  .opt.shortcut span { font-variant-numeric: tabular-nums; }
  .link { flex: none; padding: 4px 8px; font: inherit; font-size: 11.5px; color: var(--accent);
          background: none; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .link:hover { border-color: var(--accent); }
  .spinner { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px;
             border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%;
             animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 배너와 결과는 버튼 '아래'에 둔다. 위에 있으면 뒤늦게 나타나면서
     저장 버튼을 밀어내고, 그 자리에 반대 옵션이 올라온다. */
  #notice, #result { flex: none; padding: 13px 15px 0; }
  #notice:empty, #result:empty { padding: 0; }
  .card { border-radius: 9px; padding: 10px 12px; font-size: 12px; }
  .card.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .card.err { background: var(--warn-bg); color: var(--warn-fg); }
  .card b { display: block; font-size: 12.5px; margin-bottom: 3px; }
  .card .file { color: var(--fg); font-size: 11px; word-break: break-all; opacity: .85; }
  .card .stats { color: var(--fg); font-size: 11px; opacity: .75; margin-top: 5px; line-height: 1.5;
                 font-variant-numeric: tabular-nums; }
  .notice-box { border: 1.5px solid var(--warn-fg); background: var(--warn-bg); border-radius: 9px; padding: 10px 11px; }
  .notice-box b { display: block; font-size: 12.5px; color: var(--warn-fg); }
  .notice-box p { margin: 2px 0 8px; font-size: 11px; color: var(--dim); line-height: 1.4; }
  /* 제목만 경고색이고, 안의 스위치 라벨까지 물들면 안 된다 */
  .notice-box .opt b { color: var(--fg); font-size: 12px; font-weight: 500; }

  /* <details> 에 display:flex 를 줘도 내부 슬롯 구조 탓에 자식이 축소되지 않고
     삐져나온다. 그래서 목록 높이는 popup.js 의 fitOptions() 가 직접 잰다. */
  details { border-top: 1px solid var(--line); margin-top: 13px; flex: none; }
  summary { flex: none; padding: 11px 15px; font-size: 12px; color: var(--dim); cursor: pointer;
            list-style: none; display: flex; align-items: center; gap: 5px; user-select: none; }
  summary::-webkit-details-marker { display: none; }
  summary .arrow { transition: transform .15s; }
  details[open] summary .arrow { transform: rotate(90deg); }
  /* 펼쳐도 헤더·선택·버튼은 그대로 두고 옵션만 스크롤한다 */
  .opts { overflow-y: auto; overscroll-behavior: contain; padding: 0 15px 13px; }

  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; cursor: pointer; }
  .opt + .opt { border-top: 1px solid var(--line); }
  .opt.muted { opacity: .5; cursor: default; }
  .opt .txt { flex: 1; min-width: 0; }
  .opt b { display: block; font-size: 12.5px; font-weight: 500; word-break: keep-all; }
  .opt span { display: block; font-size: 11px; color: var(--dim); margin-top: 1px; line-height: 1.4; word-break: keep-all; }
  .opt .why { color: var(--warn-fg); }
  .sw { position: relative; width: 34px; height: 20px; flex: none; }
  .sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .sw i { position: absolute; inset: 0; border-radius: 999px; background: var(--off);
          transition: background .15s; pointer-events: none; }
  .sw i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
                 border-radius: 50%; background: var(--knob); transition: transform .15s;
                 box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .sw input:checked + i { background: var(--accent-btn); }
  .sw input:checked + i::after { background: #fff; transform: translateX(14px); }
  .sw input:focus-visible + i { outline: 2px solid var(--fg); outline-offset: 3px; }
  [hidden] { display: none !important; }
</style>

<header>
  <div class="brand">
    <img src="icons/icon32.png" width="16" height="16" alt="" aria-hidden="true">
    <span lang="en">Capture to HTML</span>
  </div>
  <div class="page" id="pageTitle" data-i18n="checking"></div>
  <div class="meta" id="pageMeta"></div>
</header>

<div class="top">
  <div class="heading" id="modeHeading" data-i18n="modeHeading"></div>
  <div role="radiogroup" aria-labelledby="modeHeading">
    <label class="choice" id="c-crop">
      <input type="radio" name="mode" value="crop">
      <b data-i18n="modeCrop"></b><span data-i18n="modeCropDesc"></span>
    </label>
    <label class="choice" id="c-full">
      <input type="radio" name="mode" value="full">
      <b data-i18n="modeFull"></b><span data-i18n="modeFullDesc"></span>
    </label>
  </div>
  <button class="go" id="go" disabled data-i18n="save"></button>
</div>

<div id="notice" role="status" aria-live="polite"></div>
<div id="result" role="status" aria-live="polite"></div>

<details id="adv">
  <summary><span class="arrow" aria-hidden="true">›</span><span data-i18n="advanced"></span></summary>
  <div class="opts">
    <label class="opt"><span class="sw"><input type="checkbox" id="freeze"><i></i></span>
      <span class="txt"><b data-i18n="optFreeze"></b><span data-i18n="optFreezeDesc"></span></span></label>
    <label class="opt"><span class="sw"><input type="checkbox" id="dropOverlay"><i></i></span>
      <span class="txt"><b data-i18n="optOverlay"></b><span data-i18n="optOverlayDesc"></span></span></label>
    <label class="opt"><span class="sw"><input type="checkbox" id="occlusion"><i></i></span>
      <span class="txt"><b data-i18n="optOcclusion"></b><span data-i18n="optOcclusionDesc"></span></span></label>
    <label class="opt"><span class="sw"><input type="checkbox" id="images"><i></i></span>
      <span class="txt"><b data-i18n="optImages"></b><span data-i18n="optImagesDesc"></span></span></label>
    <label class="opt"><span class="sw"><input type="checkbox" id="fonts"><i></i></span>
      <span class="txt"><b data-i18n="optFonts"></b><span data-i18n="optFontsDesc"></span></span></label>
    <label class="opt"><span class="sw"><input type="checkbox" id="frames"><i></i></span>
      <span class="txt"><b data-i18n="optFrames"></b><span data-i18n="optFramesDesc"></span></span></label>
    <label class="opt" id="opt-scroll"><span class="sw"><input type="checkbox" id="restoreScroll"><i></i></span>
      <span class="txt"><b data-i18n="optScroll"></b><span data-i18n="optScrollDesc"></span>
        <span class="why" id="scrollWhy" data-i18n="optScrollOff" hidden></span></span></label>
    <label class="opt"><span class="sw"><input type="checkbox" id="pin"><i></i></span>
      <span class="txt"><b data-i18n="optPin"></b><span data-i18n="optPinDesc"></span></span></label>
    <div class="opt shortcut">
      <span class="txt"><b data-i18n="shortcutLabel"></b><span id="shortcutValue"></span></span>
      <button type="button" class="link" id="editShortcut" data-i18n="shortcutChange"></button>
    </div>
  </div>
</details>

<script src="popup.js"></script>
</html>
